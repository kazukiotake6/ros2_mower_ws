libcamera_node:
  ros__parameters:
    width: 1280
    height: 800
    frame_rate: 60.0
    pixel_format: YUYV
    frame_id: camera_optical_frame
    camera_id: ''
    camera_info_url: 'package://mower_camera/config/ov9281_1280x800.yaml'
    # 0 uses libcamera auto-exposure and auto-gain.
    exposure_time_us: 0
    analogue_gain: 0.0
    diagnostic_period_s: 1.0
    # Negative thresholds disable severity evaluation until values are agreed.
    diagnostic_minimum_fps_warn: -1.0
    diagnostic_minimum_fps_error: -1.0
    diagnostic_maximum_queue_latency_ms_warn: -1.0
    diagnostic_maximum_queue_latency_ms_error: -1.0
    diagnostic_missing_frames_warn: -1
    diagnostic_missing_frames_error: -1
    diagnostic_request_failures_warn: -1
    diagnostic_request_failures_error: -1
